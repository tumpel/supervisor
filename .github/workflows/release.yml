name: release

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never
  TARGET: x86_64-unknown-linux-gnu

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      ref: ${{ steps.plan.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - id: plan
        name: Plan a dev build of this push, or the daily promotion of the newest dev build to stable
        env:
          BUILD: ${{ github.event_name == 'schedule' && 'stable' || 'dev' }}
          BEFORE: ${{ github.event.before }}
        run: |
          node npm-scripts/release.mjs plan "$BUILD" ${BEFORE:+"$BEFORE"} | tee -a "$GITHUB_OUTPUT"

  release:
    needs: plan
    if: needs.plan.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      STABLE: ${{ github.event_name == 'schedule' }}
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: v${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Install mksquashfs for the guest drive
        run: sudo apt-get update -q && sudo apt-get install -y -q squashfs-tools

      - run: npm ci --no-audit --no-fund

      - name: Stamp the version into the workspace
        run: node npm-scripts/release.mjs stamp "$VERSION"

      - name: Build the static guest, the guest drive and the supervisor
        env:
          TUMPEL_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          TUMPEL_TARGET: ${{ env.TARGET }}
        run: npm run supervisor:build

      - name: Stage the binaries, their sha256, release.json and the crate's guest drive
        run: node npm-scripts/release.mjs assets "$VERSION" .tmp/release

      - id: crates
        if: env.STABLE == 'true'
        name: List the crates crates.io lacks at this version
        run: echo "unpublished=$(node npm-scripts/release.mjs unpublished "$VERSION")" >> "$GITHUB_OUTPUT"

      - if: steps.crates.outputs.unpublished != ''
        name: Package the crates before anything is published
        env:
          CRATES: ${{ steps.crates.outputs.unpublished }}
        run: cargo publish --dry-run --allow-dirty $(printf -- '-p %s ' $CRATES)

      - if: steps.crates.outputs.unpublished != ''
        name: Publish the crates crates.io lacks
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CRATES: ${{ steps.crates.outputs.unpublished }}
        run: cargo publish --allow-dirty $(printf -- '-p %s ' $CRATES)

      - name: Tag the commit and publish the GitHub release with the binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$STABLE" = true ]; then kind=(--latest); else kind=(--prerelease --latest=false); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" .tmp/release/* --clobber
            gh release edit "$TAG" --draft=false "${kind[@]}"
          else
            gh release create "$TAG" .tmp/release/* --target "$(git rev-parse HEAD)" --title "$TAG" --generate-notes "${kind[@]}"
          fi

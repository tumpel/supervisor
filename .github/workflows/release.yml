name: release

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "npm-scripts/guest-drive.mjs"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the latest vX.Y.Z to bump"
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never
  TARGET: x86_64-unknown-linux-gnu

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Install mksquashfs for the guest drive
        run: sudo apt-get update -q && sudo apt-get install -y -q squashfs-tools

      - run: npm ci --no-audit --no-fund

      - id: version
        name: Number the release after the latest vX.Y.Z tag
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          version=$(node npm-scripts/release.mjs version "$BUMP")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tumpel-supervisor $version"

      - name: Stamp the version into the workspace
        run: node npm-scripts/release.mjs stamp "${{ steps.version.outputs.version }}"

      - name: Build the static guest, the guest drive and the supervisor
        env:
          TUMPEL_RELEASE_VERSION: ${{ steps.version.outputs.version }}
          TUMPEL_TARGET: ${{ env.TARGET }}
        run: npm run supervisor:build

      - name: Stage the binaries, their sha256, release.json and the crate's guest drive
        run: node npm-scripts/release.mjs assets "${{ steps.version.outputs.version }}" .tmp/release

      - name: Package the crates before anything is published
        run: cargo publish --dry-run --allow-dirty -p tumpel-channel -p tumpel-guest -p tumpel-supervisor

      - name: Tag the release
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      - name: Create the GitHub release as a draft with the binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: gh release create "$TAG" .tmp/release/* --draft --verify-tag --title "$TAG" --generate-notes

      - name: Publish the crates to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --allow-dirty -p tumpel-channel -p tumpel-guest -p tumpel-supervisor

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: gh release edit "$TAG" --draft=false --latest

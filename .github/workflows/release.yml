name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the latest vX.Y.Z to bump when the commit carries no release tag"
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never
  TARGET: x86_64-unknown-linux-gnu

jobs:
  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Install mksquashfs for the guest drive
        run: sudo apt-get update -q && sudo apt-get install -y -q squashfs-tools

      - run: npm ci --no-audit --no-fund

      - id: version
        name: Take the commit's release tag, or number the release after the latest one
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          version=$(node npm-scripts/release.mjs version "$BUMP")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tumpel-supervisor $version"

      - name: Stamp the version into the workspace
        run: node npm-scripts/release.mjs stamp "${{ steps.version.outputs.version }}"

      - name: Build the static guest, the guest drive and the supervisor
        env:
          TUMPEL_RELEASE_VERSION: ${{ steps.version.outputs.version }}
          TUMPEL_TARGET: ${{ env.TARGET }}
        run: npm run supervisor:build

      - name: Stage the binaries, their sha256, release.json and the crate's guest drive
        run: node npm-scripts/release.mjs assets "${{ steps.version.outputs.version }}" .tmp/release

      - id: crates
        name: List the crates crates.io lacks at this version
        run: echo "unpublished=$(node npm-scripts/release.mjs unpublished "${{ steps.version.outputs.version }}")" >> "$GITHUB_OUTPUT"

      - if: steps.crates.outputs.unpublished != ''
        name: Package the crates before anything is published
        env:
          CRATES: ${{ steps.crates.outputs.unpublished }}
        run: cargo publish --dry-run --allow-dirty $(printf -- '-p %s ' $CRATES)

      - name: Tag the release
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: |
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null && exit 0
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      - if: steps.crates.outputs.unpublished != ''
        name: Publish the crates crates.io lacks
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CRATES: ${{ steps.crates.outputs.unpublished }}
        run: cargo publish --allow-dirty $(printf -- '-p %s ' $CRATES)

      - name: Publish the GitHub release with the binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" .tmp/release/* --clobber
            gh release edit "$TAG" --draft=false --latest
          else
            gh release create "$TAG" .tmp/release/* --verify-tag --title "$TAG" --generate-notes --latest
          fi

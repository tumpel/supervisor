name: release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  TARGET: x86_64-unknown-linux-gnu
  SHIPPED: >-
    Cargo.toml Cargo.lock rust-toolchain.toml package.json npm-scripts/guest-drive.mjs
    crates/tumpel-channel/Cargo.toml crates/tumpel-channel/src
    crates/tumpel-guest/Cargo.toml crates/tumpel-guest/src
    crates/tumpel-supervisor/Cargo.toml crates/tumpel-supervisor/build.rs
    crates/tumpel-supervisor/release_version.rs crates/tumpel-supervisor/src

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: taiki-e/install-action@v2
        with:
          tool: convco@0.7.2

      - id: plan
        name: Name the release candidate when a shipped file changed since the newest tag
        run: |
          set -f
          stable=$(convco version --ignore-prereleases)
          next=$(convco version --bump --ignore-prereleases $(printf -- '-P %s ' $SHIPPED))
          nearest=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude 'v*-main.*')
          if [ "$next" = "$stable" ] || git diff --quiet "$nearest" HEAD -- $SHIPPED; then
            echo "release: nothing shipped needs a new version since $nearest" >&2
            echo "version=" >> "$GITHUB_OUTPUT"
          else
            echo "version=$next-rc.$(git rev-list --count "v$stable..HEAD")" | tee -a "$GITHUB_OUTPUT"
          fi

  candidate:
    needs: plan
    if: needs.plan.outputs.version != ''
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: v${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Install mksquashfs for the guest drive
        run: sudo apt-get update -q && sudo apt-get install -y -q squashfs-tools

      - run: npm ci --no-audit --no-fund

      - name: Stamp the version into the workspace
        run: node npm-scripts/release.mjs stamp "$VERSION"

      - name: Build the static guest, the guest drive and the supervisor
        env:
          TUMPEL_RELEASE_VERSION: ${{ env.VERSION }}
          TUMPEL_TARGET: ${{ env.TARGET }}
        run: npm run supervisor:build

      - name: Stage the binaries, their sha256, release.json and the crate's guest drive
        run: node npm-scripts/release.mjs assets "$VERSION" .tmp/release

      - name: Package the crates
        run: cargo publish --dry-run --allow-dirty -p tumpel-channel -p tumpel-guest -p tumpel-supervisor

      - name: Publish the GitHub pre-release with the binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          case "$draft" in
            none) gh release create "$TAG" .tmp/release/* --title "$TAG" --generate-notes --target "$GITHUB_SHA" --prerelease --latest=false ;;
            true) gh release upload "$TAG" .tmp/release/* --clobber && gh release edit "$TAG" --draft=false --prerelease --latest=false ;;
            *) echo "release: $TAG is already published; its binaries stay as they are" >&2; exit 1 ;;
          esac

name: release

on:
  workflow_run:
    workflows: [checks]
    types: [completed]
    branches: [main]

concurrency:
  group: >-
    ${{ github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        'release' || format('release-skipped-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
  TARGET: x86_64-unknown-linux-gnu
  SHIPPED: >-
    Cargo.toml Cargo.lock rust-toolchain.toml package.json npm-scripts/guest-drive.mjs
    crates/tumpel-channel/Cargo.toml crates/tumpel-channel/src
    crates/tumpel-guest/Cargo.toml crates/tumpel-guest/src
    crates/tumpel-supervisor/Cargo.toml crates/tumpel-supervisor/build.rs
    crates/tumpel-supervisor/release_version.rs crates/tumpel-supervisor/src

jobs:
  plan:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_SHA }}

      - uses: taiki-e/install-action@v2
        with:
          tool: convco@0.7.2

      - id: plan
        name: Name the release candidate when a shipped file changed since the newest tag
        run: |
          set -f
          stable=$(convco version --ignore-prereleases)
          next=$(convco version --bump --ignore-prereleases $(printf -- '-P %s ' $SHIPPED))
          version="$next-rc.$(git rev-list --count "v$stable..HEAD")"
          nearest=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude 'v*-main.*' --exclude "v$version")
          if [ "$next" = "$stable" ] || git diff --quiet "$nearest" HEAD -- $SHIPPED; then
            echo "release: nothing shipped needs a new version since $nearest" >&2
            echo "version=" >> "$GITHUB_OUTPUT"
          else
            echo "version=$version" | tee -a "$GITHUB_OUTPUT"
          fi

  candidate:
    needs: plan
    if: needs.plan.outputs.version != ''
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: v${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release

      - name: Install mksquashfs for the guest drive
        run: sudo apt-get update -q && sudo apt-get install -y -q squashfs-tools

      - run: npm ci --no-audit --no-fund

      - name: Stamp the version into the workspace
        run: node npm-scripts/release.mjs stamp "$VERSION"

      - name: Build the static guest, the guest drive and the supervisor
        env:
          TUMPEL_RELEASE_VERSION: ${{ env.VERSION }}
          TUMPEL_TARGET: ${{ env.TARGET }}
        run: npm run supervisor:build

      - name: Stage the binaries, their sha256 and release.json
        run: node npm-scripts/release.mjs assets "$VERSION" .tmp/release

      - id: publish
        name: Publish the GitHub pre-release with the binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ref="refs/tags/$TAG"
          refs=$(git ls-remote --tags origin "$ref" "$ref^{}")
          tagged=$(awk -v ref="$ref" '$2 == ref { direct = $1 } $2 == ref "^{}" { peeled = $1 } END { print peeled ? peeled : direct }' <<< "$refs")
          if [ -z "$tagged" ]; then
            git push origin "$SOURCE_SHA:$ref"
          elif [ "$tagged" != "$SOURCE_SHA" ]; then
            echo "release: $TAG points to $tagged but this candidate was built from $SOURCE_SHA; check the candidate tag" >&2
            exit 1
          fi
          draft=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .draft")
          case "$draft" in
            "") gh release create "$TAG" .tmp/release/* --title "$TAG" --generate-notes --verify-tag --prerelease --latest=false ;;
            true)
              gh release upload "$TAG" .tmp/release/* --clobber
              gh release edit "$TAG" --draft=false --prerelease --latest=false
              ;;
            false) echo "release: $TAG is already published"; exit 0 ;;
            *) echo "release: GitHub returned multiple releases for $TAG; check the candidate releases" >&2; exit 1 ;;
          esac
          echo "published=true" >> "$GITHUB_OUTPUT"

      - id: dispatch-deploy
        name: Dispatch component-released to deploy
        if: success() && steps.publish.outputs.published == 'true'
        continue-on-error: true
        env:
          DEPLOY_DISPATCH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: node npm-scripts/release.mjs dispatch-deploy

name: release

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never
  TARGET: x86_64-unknown-linux-gnu

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      ref: ${{ steps.plan.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - id: plan
        name: Plan a dev build of main, or the daily stable release of the newest dev build
        env:
          BUILD: ${{ github.event_name == 'schedule' && 'stable' || 'dev' }}
          GH_TOKEN: ${{ github.token }}
        run: node npm-scripts/release.mjs plan "$BUILD" | tee -a "$GITHUB_OUTPUT"

  release:
    needs: plan
    if: needs.plan.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      STABLE: ${{ github.event_name == 'schedule' }}
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: v${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.ref }}

      - name: Take the release script from the workflow's commit
        run: |
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout FETCH_HEAD -- npm-scripts/release.mjs

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Install mksquashfs for the guest drive
        run: sudo apt-get update -q && sudo apt-get install -y -q squashfs-tools

      - run: npm ci --no-audit --no-fund

      - name: Stamp the version into the workspace
        run: node npm-scripts/release.mjs stamp "$VERSION"

      - name: Build the static guest, the guest drive and the supervisor
        env:
          TUMPEL_RELEASE_VERSION: ${{ env.VERSION }}
          TUMPEL_TARGET: ${{ env.TARGET }}
        run: npm run supervisor:build

      - name: Stage the binaries, their sha256, release.json and the crate's guest drive
        run: node npm-scripts/release.mjs assets "$VERSION" .tmp/release

      - name: Package the crates
        run: cargo publish --dry-run --allow-dirty -p tumpel-channel -p tumpel-guest -p tumpel-supervisor

      - if: env.STABLE == 'true'
        name: Tag the stable release before anything is published
        run: |
          git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null && exit 0
          git tag "$TAG" HEAD
          git push origin "refs/tags/$TAG"

      - id: crates
        if: env.STABLE == 'true'
        name: List the crates crates.io lacks at this version
        run: echo "unpublished=$(node npm-scripts/release.mjs unpublished "$VERSION")" >> "$GITHUB_OUTPUT"

      - if: steps.crates.outputs.unpublished != ''
        name: Publish the crates crates.io lacks
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CRATES: ${{ steps.crates.outputs.unpublished }}
        run: cargo publish --allow-dirty $(printf -- '-p %s ' $CRATES)

      - name: Publish the GitHub release with the binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$STABLE" = true ]; then
            create=(--verify-tag) kind=(--latest)
          else
            create=(--target "$(git rev-parse HEAD)") kind=(--prerelease --latest=false)
          fi
          draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          case "$draft" in
            none) gh release create "$TAG" .tmp/release/* --title "$TAG" --generate-notes "${create[@]}" "${kind[@]}" ;;
            true) gh release upload "$TAG" .tmp/release/* --clobber && gh release edit "$TAG" --draft=false "${kind[@]}" ;;
            *) echo "release: $TAG is already published; its binaries stay as they are" >&2; exit 1 ;;
          esac

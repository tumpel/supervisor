[workspace]
resolver = "2"
members = ["crates/tumpel-channel", "crates/tumpel-guest", "crates/tumpel-supervisor"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/tumpel/supervisor"

[workspace.dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
ext4-view = { version = "1.0.0", features = ["std"] }
fastcdc = "5.0.0"
futures-util = { version = "0.3.32", default-features = false, features = ["sink", "std"] }
hostname = "0.4.2"
libc = "0.2.191"
reqwest = { version = "0.13.4", features = ["json"] }
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tar = "0.4.46"
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "net", "signal"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["registry", "std"] }
sd-notify = { version = "0.5.0", features = ["fdstore"] }
tumpel-api = "=0.5.0"
tumpel-channel = { path = "crates/tumpel-channel", version = "=0.1.0" }
tumpel-guest = { path = "crates/tumpel-guest", version = "=0.1.0" }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = true
codegen-units = 1

[profile.dev]
debug = false
incremental = false
